name: Distributed Content Generation

on:
  push:
    paths:
      - 'generate/**'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r generate/requirements.txt

      - name: Generate content
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COMMUNITY_ENABLE: "1"
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_MODEL: "agnes-2.5-flash"
        run: python generate/main.py --count 1

      - name: Ensure CSP allows chat widget worker
        run: echo '' | base64 -d > content/_headers

      - name: Commit and push
        run: |
          git config user.name "content-bot"
          git config user.email "bot@insurtechinsights.com"
          git add content/ keywords/
          git diff --staged --quiet || git commit -m "auto: content batch $(date +%Y-%m-%dT%H:%M:%S)"
          git push
