<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8f0f5">
<title>成功始于坚持</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --pink-100: oklch(0.96 0.02 0);
  --pink-200: oklch(0.91 0.04 0);
  --pink-300: oklch(0.85 0.06 0);
  --pink-400: oklch(0.78 0.08 0);
  --pink-500: oklch(0.68 0.12 0);
  --pink-600: oklch(0.55 0.14 0);
  --lavender-200: oklch(0.92 0.03 290);
  --text-primary: oklch(0.22 0.02 0);
  --text-secondary: oklch(0.45 0.02 0);
  --text-muted: oklch(0.65 0.01 0);
  --surface: oklch(1 0 0 / 0.85);
  --shadow-sm: 0 1px 3px oklch(0 0 0 / 0.06);
  --shadow-md: 0 4px 16px oklch(0 0 0 / 0.08);
  --radius-sm: 8px;
  --radius-md: 12px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

.bg-layer {
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(ellipse 80% 60% at 20% 80%, oklch(0.92 0.06 0 / 0.6) 0%, transparent 60%),
    radial-gradient(ellipse 60% 70% at 80% 20%, oklch(0.90 0.05 290 / 0.5) 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 50% 50%, oklch(0.94 0.03 10 / 0.4) 0%, transparent 70%),
    linear-gradient(160deg, oklch(0.97 0.01 0) 0%, oklch(0.95 0.03 300) 40%, oklch(0.97 0.02 60) 100%);
}

.petal {
  position: fixed; z-index: -1; pointer-events: none;
  width: 18px; height: 18px;
  background: radial-gradient(circle at 30% 30%, oklch(0.85 0.08 0 / 0.7), oklch(0.9 0.06 0 / 0.3));
  border-radius: 50% 0 50% 50%;
  animation: fall linear infinite;
}
.petal:nth-child(1) { left: 5%; animation-duration: 14s; animation-delay: 0s; width: 14px; height: 14px; }
.petal:nth-child(2) { left: 15%; animation-duration: 18s; animation-delay: 2s; width: 16px; height: 16px; }
.petal:nth-child(3) { left: 25%; animation-duration: 12s; animation-delay: 4s; width: 12px; height: 12px; }
.petal:nth-child(4) { left: 35%; animation-duration: 20s; animation-delay: 1s; width: 20px; height: 20px; }
.petal:nth-child(5) { left: 45%; animation-duration: 16s; animation-delay: 5s; width: 15px; height: 15px; }
.petal:nth-child(6) { left: 55%; animation-duration: 22s; animation-delay: 3s; width: 18px; height: 18px; }
.petal:nth-child(7) { left: 65%; animation-duration: 13s; animation-delay: 6s; width: 14px; height: 14px; }
.petal:nth-child(8) { left: 75%; animation-duration: 19s; animation-delay: 2.5s; width: 17px; height: 17px; }
.petal:nth-child(9) { left: 85%; animation-duration: 15s; animation-delay: 4.5s; width: 13px; height: 13px; }
.petal:nth-child(10) { left: 92%; animation-duration: 21s; animation-delay: 1.5s; width: 16px; height: 16px; }

@keyframes fall {
  0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.6; }
  100% { transform: translateY(105vh) rotate(720deg) translateX(60px); opacity: 0; }
}

.character-silhouette {
  position: fixed; bottom: -20px; right: -40px; z-index: -1; pointer-events: none;
  opacity: 0.08; width: 400px; height: 500px;
}

#fireworks { position: fixed; inset: 0; z-index: 100; pointer-events: none; display: none; }

.celebration {
  position: fixed; inset: 0; z-index: 99; display: none;
  flex-direction: column; align-items: center; justify-content: center;
  background: oklch(0 0 0 / 0.4); backdrop-filter: blur(4px);
}
.celebration.active { display: flex; }
.celebration-text {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 700; color: #fff;
  text-shadow: 0 0 30px oklch(0.8 0.15 40), 0 0 60px oklch(0.7 0.2 10);
  animation: glow 1.5s ease-in-out infinite alternate; margin-bottom: 24px;
}
@keyframes glow {
  from { text-shadow: 0 0 20px oklch(0.8 0.15 40), 0 0 40px oklch(0.7 0.2 10); }
  to { text-shadow: 0 0 40px oklch(0.85 0.25 60), 0 0 80px oklch(0.75 0.3 30), 0 0 120px oklch(0.6 0.3 0); }
}
.dance-girl { width: 280px; height: 360px; position: relative; margin: 0 auto; }
.dance-girl .body-part { position: absolute; background: oklch(0.85 0.06 350); border-radius: 4px; }
.dance-head { width: 80px; height: 90px; border-radius: 50% 50% 45% 45% !important; top: 10px; left: 50%; transform: translateX(-50%); background: oklch(0.88 0.05 350) !important; animation: dance-head 0.8s ease-in-out infinite; }
.dance-hair-l { width: 18px; height: 140px; top: 20px; left: 85px; transform-origin: top center; background: oklch(0.25 0.03 290) !important; border-radius: 10px !important; animation: dance-hair-l 0.8s ease-in-out infinite; }
.dance-hair-r { width: 18px; height: 140px; top: 20px; left: 177px; transform-origin: top center; background: oklch(0.25 0.03 290) !important; border-radius: 10px !important; animation: dance-hair-r 0.8s ease-in-out infinite; }
.dance-body { width: 55px; height: 80px; top: 100px; left: 50%; transform: translateX(-50%); animation: dance-body 0.8s ease-in-out infinite; }
.dance-arm-l { width: 14px; height: 65px; top: 105px; left: 80px; transform-origin: top center; border-radius: 7px !important; animation: dance-arm-l 0.8s ease-in-out infinite; }
.dance-arm-r { width: 14px; height: 65px; top: 105px; left: 186px; transform-origin: top center; border-radius: 7px !important; animation: dance-arm-r 0.8s ease-in-out infinite; }
.dance-skirt { width: 100px; height: 50px; top: 170px; left: 50%; transform: translateX(-50%); background: oklch(0.7 0.12 350) !important; border-radius: 10px 10px 40px 40px !important; animation: dance-skirt 0.8s ease-in-out infinite; }
.dance-leg-l { width: 16px; height: 70px; top: 215px; left: 115px; transform-origin: top center; border-radius: 8px !important; animation: dance-leg-l 0.8s ease-in-out infinite; }
.dance-leg-r { width: 16px; height: 70px; top: 215px; left: 149px; transform-origin: top center; border-radius: 8px !important; animation: dance-leg-r 0.8s ease-in-out infinite; }
.dance-eyes { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 36px; height: 10px; animation: dance-eyes 0.8s ease-in-out infinite; }
.dance-eyes::before, .dance-eyes::after { content: ''; position: absolute; width: 8px; height: 10px; background: oklch(0.2 0.02 0); border-radius: 50%; top: 0; }
.dance-eyes::before { left: 0; } .dance-eyes::after { right: 0; }
.dance-mouth { position: absolute; top: 55px; left: 50%; transform: translateX(-50%); width: 12px; height: 6px; border-bottom: 2px solid oklch(0.4 0.08 0); border-radius: 0 0 6px 6px; animation: dance-mouth 0.8s ease-in-out infinite; }
@keyframes dance-head { 0%,100% { transform: translateX(-50%) rotate(-5deg); } 50% { transform: translateX(-50%) rotate(5deg); } }
@keyframes dance-hair-l { 0%,100% { transform: rotate(10deg); } 50% { transform: rotate(-15deg); } }
@keyframes dance-hair-r { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(15deg); } }
@keyframes dance-body { 0%,100% { transform: translateX(-50%) translateX(-5px); } 50% { transform: translateX(-50%) translateX(5px); } }
@keyframes dance-arm-l { 0%,100% { transform: rotate(-30deg); } 50% { transform: rotate(40deg); } }
@keyframes dance-arm-r { 0%,100% { transform: rotate(30deg); } 50% { transform: rotate(-40deg); } }
@keyframes dance-skirt { 0%,100% { transform: translateX(-50%) rotate(-10deg) scaleX(1); } 50% { transform: translateX(-50%) rotate(10deg) scaleX(0.85); } }
@keyframes dance-leg-l { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(20deg); } }
@keyframes dance-leg-r { 0%,100% { transform: rotate(15deg); } 50% { transform: rotate(-20deg); } }
@keyframes dance-eyes { 0%,45%,55%,100% { width: 36px; } 50% { width: 0; } }
@keyframes dance-mouth { 0%,100% { transform: translateX(-50%) scaleX(1); } 50% { transform: translateX(-50%) scaleX(1.3); } }
.celebration-close { margin-top: 32px; padding: 12px 36px; font-size: 1rem; font-weight: 600; color: #fff; background: oklch(0.6 0.15 350 / 0.8); border: 2px solid oklch(0.8 0.1 350 / 0.6); border-radius: 50px; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.2s; z-index: 101; }
.celebration-close:hover { background: oklch(0.65 0.18 350 / 0.9); transform: scale(1.05); }

/* ========== LAYOUT ========== */
.app { display: flex; min-height: 100vh; max-width: 1400px; margin: 0 auto; }

.sidebar {
  width: 220px; position: sticky; top: 0; height: 100vh;
  overflow-y: auto; padding: 32px 16px;
  background: oklch(0.98 0.01 0 / 0.7); backdrop-filter: blur(12px);
  border-right: 1px solid oklch(0.9 0.02 0 / 0.5); z-index: 10;
}
.sidebar-logo { font-family: 'Noto Serif SC', serif; font-size: 1.1rem; font-weight: 700; color: var(--pink-600); margin-bottom: 24px; line-height: 1.4; }
.week-nav-item {
  display: block; padding: 10px 14px; margin-bottom: 4px; border-radius: var(--radius-sm);
  font-size: 0.85rem; font-weight: 500; color: var(--text-secondary);
  cursor: pointer; transition: all 0.2s ease; border: none; background: none; text-align: left; width: 100%;
}
.week-nav-item:hover { background: var(--pink-200); color: var(--pink-600); }
.week-nav-item.active { background: var(--pink-300); color: var(--pink-600); font-weight: 600; }
.week-nav-item .week-num { font-size: 0.7rem; font-weight: 400; color: var(--text-muted); display: block; }

.main { flex: 1; padding: 32px 40px 80px; max-width: 950px; }

.hero { margin-bottom: 36px; padding-bottom: 24px; border-bottom: 2px solid var(--pink-300); }
.hero h1 { font-family: 'Noto Serif SC', serif; font-size: clamp(1.8rem, 3.5vw, 2.4rem); font-weight: 700; color: var(--pink-600); letter-spacing: 0.06em; margin-bottom: 8px; }
.hero .subtitle { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }
.hero .stats { display: flex; gap: 24px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
.stat-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-secondary); }
.stat-item .stat-val { font-weight: 700; font-size: 1.1rem; color: var(--pink-600); }

/* ========== COUNTDOWN ========== */
.countdown-box {
  display: flex; align-items: center;
  background: linear-gradient(135deg, oklch(0.92 0.04 15 / 0.5), oklch(0.93 0.04 60 / 0.4));
  border: 1px solid oklch(0.85 0.06 30 / 0.4);
  border-radius: 20px;
  padding: 8px 18px;
  margin-top: 14px;
  width: fit-content;
  animation: countdown-pulse 2s ease-in-out infinite;
}
@keyframes countdown-pulse {
  0%, 100% { box-shadow: 0 0 0 0 oklch(0.7 0.12 30 / 0.3); }
  50% { box-shadow: 0 0 0 8px oklch(0.7 0.12 30 / 0); }
}
.countdown-box .cd-text {
  font-size: 0.88rem; font-weight: 500;
  color: oklch(0.4 0.08 30);
}

/* ========== TEXTBOOK SECTION ========== */
.textbook-section { margin-bottom: 36px; }
.textbook-header {
  margin-bottom: 14px;
  padding: 12px 16px;
  background: linear-gradient(135deg, var(--pink-200), var(--lavender-200));
  border-radius: var(--radius-md);
  border-left: 4px solid var(--pink-500);
  display: flex; align-items: center; justify-content: space-between;
}
.textbook-header h2 {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.15rem; font-weight: 600;
  color: var(--pink-600);
}
.textbook-actions { display: flex; gap: 8px; align-items: center; }
.upload-btn {
  padding: 6px 16px; font-size: 0.8rem; font-weight: 500;
  color: #fff; background: var(--pink-500); border: none;
  border-radius: 20px; cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; gap: 4px;
}
.upload-btn:hover { background: var(--pink-600); transform: scale(1.04); }
.upload-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.upload-status {
  font-size: 0.72rem; color: var(--text-muted);
  margin-left: 4px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.upload-status.error { color: oklch(0.5 0.15 15); }

.textbook-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}
.pdf-card {
  background: var(--surface);
  backdrop-filter: blur(8px);
  border-radius: var(--radius-md);
  padding: 16px 12px;
  box-shadow: var(--shadow-sm);
  border: 1px solid oklch(0.9 0.02 0 / 0.3);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex; flex-direction: column; align-items: center;
  text-align: center; gap: 8px;
}
.pdf-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--pink-400); }
.pdf-card .pdf-icon {
  width: 44px; height: 54px;
  background: linear-gradient(135deg, oklch(0.75 0.1 0), oklch(0.65 0.12 15));
  border-radius: 4px;
  position: relative;
  flex-shrink: 0;
}
.pdf-card .pdf-icon::after {
  content: 'PDF';
  position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  font-size: 0.6rem; font-weight: 700; color: #fff;
  background: oklch(0.5 0.12 0); padding: 1px 6px; border-radius: 2px;
}
.pdf-card .pdf-name {
  font-size: 0.78rem; font-weight: 500; color: var(--text-primary);
  line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; word-break: break-all;
}

.empty-hint {
  grid-column: 1 / -1;
  text-align: center; padding: 32px;
  color: var(--text-muted); font-size: 0.85rem;
}

.loading-hint {
  grid-column: 1 / -1;
  text-align: center; padding: 24px;
  color: var(--text-muted); font-size: 0.85rem;
}

/* ========== TOKEN MODAL ========== */
.token-modal {
  position: fixed; inset: 0; z-index: 300; display: none;
  align-items: center; justify-content: center;
  background: oklch(0 0 0 / 0.5); backdrop-filter: blur(4px);
}
.token-modal.active { display: flex; }
.token-dialog {
  background: #fff;
  border-radius: var(--radius-md);
  padding: 28px 24px;
  max-width: 420px; width: 90%;
  box-shadow: 0 8px 32px oklch(0 0 0 / 0.15);
}
.token-dialog h3 { font-family: 'Noto Serif SC', serif; font-size: 1.05rem; margin-bottom: 6px; color: var(--pink-600); }
.token-dialog p { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 14px; line-height: 1.6; }
.token-dialog p a { color: var(--pink-500); }
.token-dialog input {
  width: 100%; padding: 10px 12px; font-size: 0.85rem;
  border: 1px solid oklch(0.85 0.02 0); border-radius: 6px;
  margin-bottom: 14px; outline: none;
}
.token-dialog input:focus { border-color: var(--pink-400); box-shadow: 0 0 0 3px oklch(0.8 0.08 0 / 0.15); }
.token-dialog .btn-row { display: flex; gap: 8px; justify-content: flex-end; }
.token-dialog button {
  padding: 8px 20px; border-radius: 6px; font-size: 0.82rem; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
}
.token-dialog .btn-cancel { background: #f5f5f5; border: 1px solid #ddd; color: var(--text-secondary); }
.token-dialog .btn-save { background: var(--pink-500); border: none; color: #fff; }
.token-dialog .btn-save:hover { background: var(--pink-600); }

/* ========== PDF VIEWER MODAL ========== */
.pdf-modal {
  position: fixed; inset: 0; z-index: 200; display: none;
  flex-direction: column;
  background: oklch(0 0 0 / 0.7); backdrop-filter: blur(6px);
}
.pdf-modal.active { display: flex; }
.pdf-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px;
  background: oklch(0.98 0.01 0 / 0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid oklch(0.88 0.02 0 / 0.5);
}
.pdf-modal-title { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); flex: 1; margin-right: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pdf-modal-actions { display: flex; gap: 8px; }
.pdf-modal-btn {
  padding: 6px 14px; font-size: 0.78rem; font-weight: 500;
  border-radius: 6px; cursor: pointer; border: 1px solid oklch(0.85 0.02 0);
  background: #fff; color: var(--text-secondary);
  transition: all 0.15s;
}
.pdf-modal-btn:hover { background: var(--pink-200); }
.pdf-modal-btn.close-btn { color: oklch(0.5 0.15 15); border-color: oklch(0.8 0.08 15 / 0.4); }
.pdf-modal-btn.close-btn:hover { background: oklch(0.92 0.06 15 / 0.2); }
.pdf-modal-body { flex: 1; overflow: hidden; position: relative; }
.pdf-modal-body iframe { width: 100%; height: 100%; border: none; }

/* Week section */
.week-section { margin-bottom: 40px; }
.week-header {
  margin-bottom: 16px; padding: 12px 16px;
  background: linear-gradient(135deg, var(--pink-200), var(--lavender-200));
  border-radius: var(--radius-md);
  border-left: 4px solid var(--pink-500);
}
.week-header h2 { font-family: 'Noto Serif SC', serif; font-size: 1.15rem; font-weight: 600; color: var(--pink-600); }
.week-header .week-goal { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }

.day-card {
  background: var(--surface); backdrop-filter: blur(8px);
  border-radius: var(--radius-md); margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  border: 1px solid oklch(0.9 0.02 0 / 0.3); overflow: hidden;
  transition: box-shadow 0.2s ease, transform 0.15s ease, background 0.4s ease, border-color 0.4s ease;
}
.day-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.day-card.completed { background: oklch(0.92 0.08 145 / 0.25); border-color: oklch(0.75 0.12 145 / 0.4); }
.day-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; cursor: pointer; user-select: none;
  transition: background 0.15s ease;
}
.day-header:hover { background: oklch(0.97 0.01 0 / 0.5); }
.day-title { display: flex; align-items: center; gap: 10px; flex: 1; }
.day-num { font-family: 'Noto Serif SC', serif; font-size: 0.85rem; font-weight: 700; color: var(--pink-500); min-width: 50px; }
.day-date { font-size: 0.9rem; font-weight: 500; color: var(--text-primary); }
.day-meta { display: flex; align-items: center; gap: 10px; }
.task-count { font-size: 0.75rem; color: var(--text-muted); background: var(--pink-200); padding: 2px 8px; border-radius: 12px; }
.star-toggle {
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; cursor: pointer; color: oklch(0.8 0.02 0);
  transition: color 0.3s ease, transform 0.2s ease; user-select: none; flex-shrink: 0;
}
.star-toggle:hover { transform: scale(1.25); }
.star-toggle.active { color: oklch(0.55 0.18 145); }
.expand-icon { font-size: 0.7rem; color: var(--text-muted); transition: transform 0.2s ease; }
.day-card.expanded .expand-icon { transform: rotate(180deg); }

.task-list { display: none; border-top: 1px solid oklch(0.93 0.02 0 / 0.5); }
.day-card.expanded .task-list { display: block; }
.task-item {
  display: grid; grid-template-columns: 120px 60px 90px 1fr; gap: 8px;
  padding: 8px 16px; font-size: 0.82rem;
  border-bottom: 1px solid oklch(0.95 0.01 0 / 0.4); align-items: center;
}
.task-item:last-child { border-bottom: none; }
.task-period { color: var(--text-secondary); font-weight: 500; font-size: 0.78rem; }
.task-duration { text-align: center; color: var(--text-muted); font-size: 0.75rem; background: oklch(0.96 0.01 0 / 0.6); border-radius: 4px; padding: 1px 6px; }
.task-subject { font-weight: 600; font-size: 0.78rem; text-align: center; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.task-desc { color: var(--text-secondary); line-height: 1.5; font-size: 0.8rem; }

.s-math { background: oklch(0.92 0.06 25 / 0.3); color: oklch(0.45 0.12 25); }
.s-chem { background: oklch(0.92 0.05 250 / 0.3); color: oklch(0.45 0.1 250); }
.s-bio { background: oklch(0.92 0.06 145 / 0.3); color: oklch(0.4 0.1 145); }
.s-phy { background: oklch(0.93 0.05 300 / 0.3); color: oklch(0.4 0.1 300); }
.s-eng { background: oklch(0.93 0.06 80 / 0.3); color: oklch(0.45 0.1 80); }
.s-other { background: oklch(0.95 0.01 0 / 0.3); color: oklch(0.5 0.02 0); }

@media (max-width: 768px) {
  body { -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
  .app { flex-direction: column; }

// ========== TOKEN MANAGEMENT ==========
function getToken() { return localStorage.getItem('gh_token_yasi'); }
function setToken(t) { localStorage.setItem('gh_token_yasi', t); }

function handleUploadClick() {

// ========== FETCH PDFs FROM GITHUB ==========
async function fetchRepoPDFs() {
  try {
    const resp = await fetch(GITHUB_API + '/repos/' + GITHUB_REPO + '/contents/' + PDF_PATH);
    if (!resp.ok) throw new Error('API error: ' + resp.status);
    const files = await resp.json();
    return files
      .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.pdf'))
      .map(f => ({ name: f.name, download_url: f.download_url, sha: f.sha }));
  } catch (e) {
    console.error('Fetch PDFs failed:', e);
    return [];
  }
}

async function renderPDFCards() {
  const grid = document.getElementById('textbookGrid');
  grid.innerHTML = '<div class="loading-hint">加载中...</div>';
  const pdfs = await fetchRepoPDFs();

  if (pdfs.length === 0) {
    grid.innerHTML = '<div class="empty-hint">还没有教材PDF，点击「+ 上传PDF」添加（首次需配置 GitHub Token）</div>';
    return;
  }

  grid.innerHTML = pdfs.map(p => `
    <div class="pdf-card" onclick="openPdfViewer('${escapeHtml(p.name)}', '${escapeHtml(p.download_url)}')">
      <div class="pdf-icon"></div>
      <span class="pdf-name" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</span>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ========== UPLOAD PDF TO GITHUB ==========
async function handlePdfUpload(event) {
  const files = event.target.files;
  if (!files.length) return;

  const token = getToken();
  if (!token) {
    document.getElementById('tokenModal').classList.add('active');
    event.target.value = '';
    return;
  }

  const status = document.getElementById('uploadStatus');
  const btn = document.getElementById('uploadBtn');

  for (const file of files) {
    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) continue;

    status.textContent = '正在上传 ' + file.name + '...';
    status.className = 'upload-status';
    btn.disabled = true;

    try {
      const reader = new FileReader();
      const base64Content = await new Promise((resolve, reject) => {
        reader.onload = () => {
          const result = reader.result;
          const comma = result.indexOf(',');
          resolve(result.substring(comma + 1));
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const path = PDF_PATH + '/' + file.name;
      const apiUrl = GITHUB_API + '/repos/' + GITHUB_REPO + '/contents/' + path;

      const body = JSON.stringify({
        message: 'Upload ' + file.name,
        content: base64Content,
        branch: 'main'
      });

      const resp = await fetch(apiUrl, {
        method: 'PUT',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: body
      });

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.message || 'HTTP ' + resp.status);
      }

      status.textContent = file.name + ' 上传成功！';
      status.className = 'upload-status';
      await renderPDFCards();
    } catch (e) {
      status.textContent = '上传失败: ' + e.message;
      status.className = 'upload-status error';
    } finally {
      btn.disabled = false;
    }
  }

  event.target.value = '';
  setTimeout(() => { if (status.className === 'upload-status') status.textContent = ''; }, 3000);
}

// ========== STUDY PLAN ==========
function getSubjectClass(subject) {
  const s = subject.toLowerCase();
  if (s.includes('数学')) return 's-math';
  if (s.includes('化学')) return 's-chem';
  if (s.includes('生物')) return 's-bio';
  if (s.includes('物理')) return 's-phy';
  if (s.includes('英语') || s.includes('雅思') || s.includes('bbc') || s.includes('ted')) return 's-eng';
  return 's-other';
}

// ========== STAR TOGGLE ==========
function toggleStar(dayNum) {
  const card = document.getElementById('day-' + dayNum);
  const star = card.querySelector('.star-toggle');
  const isActive = star.classList.contains('active');
  if (isActive) {
    star.classList.remove('active');
    star.textContent = '☆';
    card.classList.remove('completed');
  } else {
    star.classList.add('active');
    star.textContent = '★';
    card.classList.add('completed');
    if (dayNum === TOTAL_DAYS) {
      setTimeout(() => {
        const lastStar = document.getElementById('day-' + TOTAL_DAYS).querySelector('.star-toggle');
        if (lastStar.classList.contains('active')) triggerCelebration();
      }, 400);
    }
  }
}

// ========== FIREWORKS ==========
const canvas = document.getElementById('fireworks');
const ctx = canvas.getContext('2d');
let particles = [];
let animationId = null;

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
  constructor(x, y) {
    this.x = x; this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 6 + 3;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1;
    this.decay = Math.random() * 0.015 + 0.008;
    this.size = Math.random() * 3 + 1.5;
    this.hue = Math.random() * 360;
  }
  update() { this.x += this.vx; this.y += this.vy; this.vy += 0.04; this.life -= this.decay; }
  draw() {
    ctx.save(); ctx.globalAlpha = this.life;
    ctx.fillStyle = `hsl(${this.hue}, 80%, 60%)`;
    ctx.shadowBlur = 6; ctx.shadowColor = `hsl(${this.hue}, 80%, 60%)`;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function spawnFirework() {
  const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
  const y = Math.random() * canvas.height * 0.5 + canvas.height * 0.1;
  for (let i = 0; i < 60; i++) particles.push(new Particle(x, y));
}

function animateFireworks() {
  if (particles.length === 0 && !animationId) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.globalCompositeOperation = 'lighter';
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => { p.update(); p.draw(); });
  if (Math.random() < 0.15) spawnFirework();
  animationId = requestAnimationFrame(animateFireworks);
}

function triggerCelebration() {
  canvas.style.display = 'block';
  document.getElementById('celebration').classList.add('active');
  for (let i = 0; i < 3; i++) spawnFirework();
  animateFireworks();
  setInterval(() => {
    if (document.getElementById('celebration').classList.contains('active')) spawnFirework();
  }, 800);
}

function closeCelebration() {
  document.getElementById('celebration').classList.remove('active');
  canvas.style.display = 'none';
  particles = [];
  if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

  let observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id;
        document.querySelectorAll('.week-nav-item').forEach((btn, i) => {
          btn.classList.toggle('active', 'week-' + i === id);
        });
      }
    });
  }, { threshold: 0.3 });

  setTimeout(() => {
    document.querySelectorAll('.week-section').forEach(s => observer.observe(s));
  }, 100);
});
