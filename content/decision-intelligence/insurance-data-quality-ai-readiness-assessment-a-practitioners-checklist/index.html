            <h1>Insurance Data Quality AI Readiness Assessment: A Practitioner’s Checklist</h1>
            <div class="article-meta">
                <time datetime="2026-05-31T23:46:42+00:00">May 31, 2026</time>
            </div>
        </header>

        <div class="article-content">
<h2>Insurance Data Quality AI Readiness Assessment: A Practitioner’s Checklist</h2>

<p>I’ve seen claims teams burn months of runway because they treated data quality as an afterthought. One mid-size P&C carrier kicked off a fraud detection pilot with 12% missing claimant addresses. The model’s precision tanked, and the project was shelved. That’s avoidable. This guide walks through a repeatable framework to assess whether your data is fit for AI—before you write a single line of code.</p>

<h3>Why a checklist is non-negotiable</h3>
<p>Insurance data is messy by design: policy inception dates, loss runs, bordereaux from TPAs, and unstructured adjuster notes. AI models chew through this raw material. If your data has a 20% duplicate rate or 30% missing values in key rating fields, your combined ratio on AI projects will climb fast.</p>

<hr>

<h2>Phase 1: Inventory & Criticality Mapping</h2>
<p>Start with a data catalog that answers: <strong>what exists, where it lives, who owns it, and how it’s used.</strong> Without this, you’re flying blind.</p>

<h3>Step 1: Define your AI use case boundary</h3>
<ul>
<li><strong>Goal:</strong> Narrow the scope to something bounded like “predictive underwriting for small commercial auto” or “fraud signal extraction from SIU reports.”</li>
<li><strong>Trade-off:</strong> If you try to boil the ocean (e.g., “transform claims end-to-end”), your checklist becomes a sprawling spreadsheet that no one updates.</li>
</ul>

<p><strong>Example:</strong> A regional carrier targeting a 5% uplift in loss ratio through telematics underwriting limited its AI scope to renewal auto policies with ≤$500K premium.</p>

<h3>Step 2: Map data sources to use case</h3>
<p>Create a table like the one below. Include the data’s origin (TPA, MGA, internal system), format (CSV, JSON, PDF), and update cadence.</p>

<table border="1" cellpadding="4" cellspacing="0" style="border-collapse: collapse; width: 100%;">
<thead>
<tr>
<th>Data Asset</th>
<th>Source System</th>
<th>Format</th>
<th>Update Frequency</th>
<th>Use Case Role</th>
</tr>
</thead>
<tbody>
<tr>
<td>Loss Runs (last 3 years)</td>
<td>Guidewire ClaimCenter</td>
<td>CSV (via ETL)</td>
<td>Weekly</td>
<td>Target variable for severity models</td>
</tr>
<tr>
<td>Vehicle Telematics (last 12 months)</td>
<td>OEM API (via third-party telematics vendor)</td>
<td>JSON</td>
<td>Daily</td>
<td>Predictive underwriting features</td>
</tr>
<tr>
<td>SIU Referral Narratives</td>
<td>Internal SharePoint</td>
<td>Unstructured PDF</td>
<td>Ad-hoc</td>
<td>Fraud signal extraction</td>
</tr>
<tr>
<td>Bordereaux (TPA)</td>
<td>Cognizant TPA Platform</td>
<td>Excel (monthly batch)</td>
<td>Monthly</td>
<td>Premium audit reconciliation</td>
</tr>
</tbody>
</table>

<h3>Step 3: Identify key fields and business rules</h3>
<p>For each use case, list the 10–15 fields that directly impact outcomes. For example:</p>
<ul>
<li><strong>Underwriting:</strong> Driver age, vehicle make/model, ZIP code, prior losses.</li>
<li><strong>Claims:</strong> Date of loss, incurred loss amount, cause of loss, adjuster notes.</li>
</ul>

<p><strong>Trade-off:</strong> Including “nice-to-have” fields like policyholder’s favorite color will dilute model performance and inflate data cleaning costs.</p>

<h3>Resource estimate (Phase 1)</h3>
<ul>
<li>Analyst time: 2–3 weeks full-time.</li>
<li>Tooling: Collibra or Alation (if you have budget); otherwise, a shared Confluence page with manual updates.</li>
</ul>

<hr>

<h2>Phase 2: Data Profiling & Quality Metrics</h2>

<h3>Step 4: Run automated profiling</h3>
<p>Use open-source tools like <code>pandas-profiling</code> (Python) or commercial suites like Informatica Data Quality. Focus on:</p>
<ul>
<li>Completeness: % missing values per field.</li>
<li>Uniqueness: Duplicate policy numbers or claim IDs.</li>
<li>Consistency: Inconsistent date formats (MM/DD/YYYY vs. YYYY-MM-DD).</li>
<li>Validity: ZIP codes outside 5-digit ranges or ICD-10 codes that don’t exist.</li>
</ul>

<p><strong>Example snippet:</strong></p>

<pre><code>import pandas as pd
from ydata_profiling import ProfileReport

# Load loss run data
df = pd.read_csv("loss_runs_2023.csv")

# Generate profile
profile = ProfileReport(df, title="Loss Runs 2023")
profile.to_file("loss_runs_profile.html")
</code></pre>

<p><strong>Trade-off:</strong> Profiling tools can flag 100+ issues. Prioritize those that violate business rules (e.g., negative incurred loss amounts) over cosmetic outliers.</p>

<h3>Step 5: Calculate downstream impact</h3>
<p>Quantify the cost of poor quality. For example:</p>
<ul>
<li>If 15% of claims are missing “cause of loss,” your fraud model’s precision drops by ~12% (based on a 2022 study by ISO ClaimSearch).</li>
<li>If ZIP code is missing for 20% of policies, your territorial ratemaking error could exceed 8% of premium (per NAIC data).</li>
</ul>

<h3>Step 6: Validate against regulatory & actuarial standards</h3>
<p>Check against:</p>
<ul>
<li><strong>NAIC Model Laws:</strong> For example, Schedule P requires loss development patterns to be auditable. If your data lacks transaction IDs for each loss payment, you’re non-compliant.</li>
<li><strong>IFRS 17:</strong> For reserving models, ensure granularity for each cash-flow component (e.g., claims handling expenses broken down by adjuster).</li>
</ul>
